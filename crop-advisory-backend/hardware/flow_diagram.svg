<svg viewBox="0 0 900 1180" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a3c34"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="1180" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a3c34">
    ESP32 Firmware Flow Diagram
  </text>

  <!-- Start (oval) -->
  <ellipse cx="450" cy="80" rx="90" ry="30" fill="#1a3c34"/>
  <text x="450" y="86" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">Power On / Reset</text>

  <!-- Connect WiFi -->
  <rect x="330" y="140" width="240" height="60" rx="8" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="450" y="165" text-anchor="middle" font-size="12.5" fill="#1a3c34">Connect to Wi-Fi</text>
  <text x="450" y="182" text-anchor="middle" font-size="10.5" fill="#555">(configured SSID / password)</text>

  <!-- WiFi decision -->
  <polygon points="450,220 560,270 450,320 340,270" fill="#f5f9f8" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="450" y="266" text-anchor="middle" font-size="11.5" fill="#1a3c34">Connected?</text>
  <text x="450" y="282" text-anchor="middle" font-size="10" fill="#555">within 15 sec</text>

  <!-- retry loop -->
  <rect x="620" y="240" width="180" height="60" rx="8" fill="#fdf3ea" stroke="#c98a3e" stroke-width="1.5"/>
  <text x="710" y="265" text-anchor="middle" font-size="11.5" fill="#7a4a10">Wait 5s, retry</text>
  <text x="710" y="282" text-anchor="middle" font-size="10" fill="#7a4a10">(up to 5 attempts)</text>

  <!-- Sync NTP time -->
  <rect x="330" y="360" width="240" height="60" rx="8" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="450" y="385" text-anchor="middle" font-size="12.5" fill="#1a3c34">Sync current time (NTP)</text>
  <text x="450" y="402" text-anchor="middle" font-size="10.5" fill="#555">used to compute days-since-sowing</text>

  <!-- Read sensors -->
  <rect x="300" y="450" width="300" height="90" rx="8" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="450" y="475" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3c34">Read Sensors</text>
  <text x="450" y="494" text-anchor="middle" font-size="10.5" fill="#333">DHT22 → temperature, humidity</text>
  <text x="450" y="510" text-anchor="middle" font-size="10.5" fill="#333">Capacitive sensor → soil moisture</text>
  <text x="450" y="526" text-anchor="middle" font-size="10.5" fill="#333">FC-37 → rain status</text>

  <!-- Compute days -->
  <rect x="330" y="580" width="240" height="60" rx="8" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="450" y="605" text-anchor="middle" font-size="12.5" fill="#1a3c34">Compute days-since-sowing</text>
  <text x="450" y="622" text-anchor="middle" font-size="10.5" fill="#555">(today − fixed sowing date)</text>

  <!-- Build JSON -->
  <rect x="330" y="680" width="240" height="60" rx="8" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="450" y="705" text-anchor="middle" font-size="12.5" fill="#1a3c34">Build JSON payload</text>
  <text x="450" y="722" text-anchor="middle" font-size="10.5" fill="#555">moisture, temp, humidity, days</text>

  <!-- POST -->
  <rect x="330" y="780" width="240" height="60" rx="8" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="450" y="805" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3c34">HTTPS POST /sensor-data</text>
  <text x="450" y="822" text-anchor="middle" font-size="10.5" fill="#555">to backend on Render</text>

  <!-- decision success -->
  <polygon points="450,860 560,910 450,960 340,910" fill="#f5f9f8" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="450" y="906" text-anchor="middle" font-size="11.5" fill="#1a3c34">Response 200?</text>

  <!-- error log -->
  <rect x="620" y="880" width="180" height="60" rx="8" fill="#fdeceb" stroke="#b3413a" stroke-width="1.5"/>
  <text x="710" y="905" text-anchor="middle" font-size="11.5" fill="#7a1f18">Log error</text>
  <text x="710" y="922" text-anchor="middle" font-size="10" fill="#7a1f18">(keep last reading cached)</text>

  <!-- Wait interval -->
  <rect x="330" y="1000" width="240" height="60" rx="8" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="450" y="1025" text-anchor="middle" font-size="12.5" fill="#1a3c34">Wait interval (e.g. 5 min)</text>
  <text x="450" y="1042" text-anchor="middle" font-size="10.5" fill="#555">then loop back to Read Sensors</text>

  <!-- Arrows main path -->
  <line x1="450" y1="110" x2="450" y2="135" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="450" y1="200" x2="450" y2="216" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="450" y1="320" x2="450" y2="355" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="470" y="342" font-size="10.5" fill="#1a6b3c">Yes</text>
  <line x1="450" y1="420" x2="450" y2="445" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="450" y1="540" x2="450" y2="575" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="450" y1="640" x2="450" y2="675" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="450" y1="740" x2="450" y2="775" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="450" y1="840" x2="450" y2="855" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="450" y1="960" x2="450" y2="995" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="470" y="982" font-size="10.5" fill="#1a6b3c">Yes</text>

  <!-- Retry branch -->
  <line x1="560" y1="270" x2="618" y2="265" stroke="#c98a3e" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="580" y="258" font-size="10.5" fill="#c98a3e">No</text>
  <path d="M710,240 L710,120 L545,80" fill="none" stroke="#c98a3e" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Error branch -->
  <line x1="560" y1="910" x2="618" y2="908" stroke="#b3413a" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="580" y="900" font-size="10.5" fill="#b3413a">No</text>
  <path d="M710,940 L710,1030 L575,1030" fill="none" stroke="#b3413a" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Loop back -->
  <path d="M330,1030 L120,1030 L120,495 L295,495" fill="none" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="130" y="765" font-size="10.5" fill="#1a3c34" transform="rotate(-90 130,765)">loop</text>
</svg>
