<svg viewBox="0 0 1100 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="680" fill="#ffffff"/>
  <text x="550" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a3c34">
    Wiring Diagram v2 — ESP32 DevKit to Sensors
  </text>
  <text x="550" y="52" text-anchor="middle" font-size="11.5" fill="#666">
    Red = 3.3V power   Black = GND   Blue = signal/data   (BH1750 removed — unused by the advisory logic)
  </text>

  <rect x="420" y="230" width="260" height="300" rx="12" fill="#2b2b2b" stroke="#000" stroke-width="2"/>
  <text x="550" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">ESP32 DevKit</text>
  <rect x="480" y="270" width="140" height="60" fill="#444" stroke="#888"/>
  <text x="550" y="305" text-anchor="middle" font-size="10" fill="#ccc">USB / Antenna</text>

  <circle cx="420" cy="380" r="4" fill="#e74c3c"/>
  <text x="405" y="384" text-anchor="end" font-size="11" fill="#1a3c34">3V3</text>
  <circle cx="420" cy="410" r="4" fill="#222"/>
  <text x="405" y="414" text-anchor="end" font-size="11" fill="#1a3c34">GND</text>
  <circle cx="420" cy="440" r="4" fill="#2980ff"/>
  <text x="405" y="444" text-anchor="end" font-size="11" fill="#1a3c34">GPIO4</text>
  <circle cx="420" cy="470" r="4" fill="#2980ff"/>
  <text x="405" y="474" text-anchor="end" font-size="11" fill="#1a3c34">GPIO34 (ADC)</text>
  <circle cx="420" cy="500" r="4" fill="#2980ff"/>
  <text x="405" y="504" text-anchor="end" font-size="11" fill="#1a3c34">GPIO35 (ADC)</text>

  <rect x="60" y="140" width="180" height="90" rx="8" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="150" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3c34">DHT22</text>
  <text x="150" y="183" text-anchor="middle" font-size="10" fill="#333">Temp / Humidity</text>
  <text x="150" y="200" text-anchor="middle" font-size="9.5" fill="#555">VCC · GND · DATA</text>
  <text x="150" y="216" text-anchor="middle" font-size="9" fill="#888">(add 10k pull-up: DATA to VCC)</text>

  <rect x="60" y="360" width="180" height="90" rx="8" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="150" y="385" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3c34">Capacitive Soil</text>
  <text x="150" y="402" text-anchor="middle" font-size="10" fill="#333">Moisture Sensor v1.2</text>
  <text x="150" y="420" text-anchor="middle" font-size="9.5" fill="#555">VCC · GND · AOUT</text>
  <text x="150" y="436" text-anchor="middle" font-size="9" fill="#888">(reads 16-sample averaged in firmware)</text>

  <rect x="60" y="470" width="180" height="90" rx="8" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="150" y="495" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3c34">FC-37 Rain Sensor</text>
  <text x="150" y="513" text-anchor="middle" font-size="10" fill="#333">(with LM393 comparator)</text>
  <text x="150" y="530" text-anchor="middle" font-size="9.5" fill="#555">VCC · GND · AOUT</text>
  <text x="150" y="546" text-anchor="middle" font-size="9" fill="#888">(now actually transmitted to backend)</text>

  <rect x="850" y="330" width="180" height="110" rx="8" fill="#fdf3ea" stroke="#c98a3e" stroke-width="1.5"/>
  <text x="940" y="355" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a4a10">Power Source</text>
  <text x="940" y="375" text-anchor="middle" font-size="10" fill="#7a4a10">One-week prototype: USB 5V</text>
  <text x="940" y="393" text-anchor="middle" font-size="10" fill="#7a4a10">(laptop or wall adapter)</text>
  <text x="940" y="415" text-anchor="middle" font-size="9.5" fill="#a06424">Solar + battery is future work —</text>
  <text x="940" y="430" text-anchor="middle" font-size="9.5" fill="#a06424">not attempted this week (see README)</text>

  <path d="M240,170 L420,380" fill="none" stroke="#e74c3c" stroke-width="1.5"/>
  <path d="M240,185 L420,410" fill="none" stroke="#222" stroke-width="1.5"/>
  <path d="M240,200 L420,440" fill="none" stroke="#2980ff" stroke-width="1.8"/>

  <path d="M240,382 L420,380" fill="none" stroke="#e74c3c" stroke-width="1.5"/>
  <path d="M240,398 L420,410" fill="none" stroke="#222" stroke-width="1.5"/>
  <path d="M240,414 L420,470" fill="none" stroke="#2980ff" stroke-width="1.8"/>

  <path d="M240,493 L420,380" fill="none" stroke="#e74c3c" stroke-width="1.5"/>
  <path d="M240,509 L420,410" fill="none" stroke="#222" stroke-width="1.5"/>
  <path d="M240,525 L420,500" fill="none" stroke="#2980ff" stroke-width="1.8"/>

  <path d="M850,385 L700,385" fill="none" stroke="#c98a3e" stroke-width="2.5"/>
  <text x="775" y="378" text-anchor="middle" font-size="10" fill="#7a4a10">5V / VIN</text>

  <rect x="850" y="140" width="200" height="150" rx="8" fill="#fbfbfb" stroke="#cccccc" stroke-width="1"/>
  <text x="870" y="165" font-size="12" font-weight="bold" fill="#1a3c34">Pin Assignment Summary</text>
  <text x="870" y="187" font-size="10.5" fill="#333">DHT22 data → GPIO4</text>
  <text x="870" y="205" font-size="10.5" fill="#333">Soil moisture → GPIO34 (ADC)</text>
  <text x="870" y="223" font-size="10.5" fill="#333">Rain sensor → GPIO35 (ADC)</text>
  <text x="870" y="241" font-size="10.5" fill="#333">All sensor VCC → 3V3</text>
  <text x="870" y="259" font-size="10.5" fill="#333">All GND → common GND</text>
  <text x="870" y="277" font-size="9.5" fill="#888">(matches config.example.h exactly)</text>
</svg>
