<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a3c34"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a3c34">
    System Block Diagram — Voice-First Crop Advisory (Paddy, Bhatkal)
  </text>

  <!-- Field Node -->
  <rect x="40" y="90" width="230" height="150" rx="10" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="155" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3c34">Field Sensor Node</text>
  <text x="155" y="140" text-anchor="middle" font-size="11.5" fill="#333">ESP32 DevKit</text>
  <text x="155" y="160" text-anchor="middle" font-size="11.5" fill="#333">DHT22 (Temp / Humidity)</text>
  <text x="155" y="180" text-anchor="middle" font-size="11.5" fill="#333">Capacitive Soil Moisture</text>
  <text x="155" y="200" text-anchor="middle" font-size="11.5" fill="#333">FC-37 Rain Sensor</text>
  <text x="155" y="220" text-anchor="middle" font-size="11.5" fill="#333">BH1750 Light (optional)</text>

  <!-- WiFi -->
  <rect x="330" y="130" width="150" height="70" rx="10" fill="#f5f9f8" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="405" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3c34">Wi-Fi / Internet</text>
  <text x="405" y="178" text-anchor="middle" font-size="10.5" fill="#333">(hotspot / router)</text>

  <!-- Backend -->
  <rect x="540" y="90" width="230" height="150" rx="10" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="655" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3c34">Cloud Backend</text>
  <text x="655" y="140" text-anchor="middle" font-size="11.5" fill="#333">FastAPI on Render</text>
  <text x="655" y="160" text-anchor="middle" font-size="11.5" fill="#333">Rule Engine (paddy logic)</text>
  <text x="655" y="180" text-anchor="middle" font-size="11.5" fill="#333">Weather API (rain risk)</text>
  <text x="655" y="200" text-anchor="middle" font-size="11.5" fill="#333">Mandi Price API</text>

  <!-- LLM -->
  <rect x="540" y="290" width="230" height="90" rx="10" fill="#f5f9f8" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="655" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3c34">LLM Layer</text>
  <text x="655" y="342" text-anchor="middle" font-size="11.5" fill="#333">Gemini 2.5 Flash</text>
  <text x="655" y="360" text-anchor="middle" font-size="10.5" fill="#333">(paraphrase-only, grounded)</text>

  <!-- Twilio -->
  <rect x="850" y="90" width="230" height="150" rx="10" fill="#eef5f3" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="965" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3c34">Delivery Layer</text>
  <text x="965" y="140" text-anchor="middle" font-size="11.5" fill="#333">Twilio</text>
  <text x="965" y="165" text-anchor="middle" font-size="11.5" fill="#333">Voice Call (TTS, hi-IN)</text>
  <text x="965" y="185" text-anchor="middle" font-size="11.5" fill="#333">SMS Fallback</text>

  <!-- Farmer -->
  <rect x="850" y="290" width="230" height="90" rx="10" fill="#f5f9f8" stroke="#1a3c34" stroke-width="1.5"/>
  <text x="965" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a3c34">Farmer</text>
  <text x="965" y="342" text-anchor="middle" font-size="11.5" fill="#333">Basic / feature phone</text>
  <text x="965" y="360" text-anchor="middle" font-size="10.5" fill="#333">receives call + SMS</text>

  <!-- Arrows -->
  <line x1="270" y1="165" x2="325" y2="165" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="165" x2="535" y2="165" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="655" y1="240" x2="655" y2="285" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="165" x2="845" y2="165" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="335" x2="845" y2="335" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="965" y1="240" x2="965" y2="285" stroke="#1a3c34" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Labels on arrows -->
  <text x="297" y="155" text-anchor="middle" font-size="9.5" fill="#666">HTTPS POST</text>
  <text x="507" y="155" text-anchor="middle" font-size="9.5" fill="#666">JSON sensor data</text>
  <text x="807" y="155" text-anchor="middle" font-size="9.5" fill="#666">Call / SMS message</text>

  <!-- Legend / note -->
  <rect x="40" y="440" width="1040" height="90" rx="8" fill="#fbfbfb" stroke="#cccccc" stroke-width="1"/>
  <text x="60" y="465" font-size="12" font-weight="bold" fill="#1a3c34">Flow summary:</text>
  <text x="60" y="486" font-size="11" fill="#333">
    1. ESP32 reads soil moisture, temperature/humidity and rain status, then POSTs JSON over Wi-Fi to the backend.
  </text>
  <text x="60" y="504" font-size="11" fill="#333">
    2. Backend's rule engine merges this with live weather and mandi price data to produce structured advisory facts.
  </text>
  <text x="60" y="522" font-size="11" fill="#333">
    3. Gemini paraphrases those facts (never invents new ones) into a spoken message, which Twilio delivers as a call + SMS to the farmer.
  </text>
</svg>
